version: "3.9"

# Vulnerable mode overlay — intentionally insecure API, no gateway.
# Usage: docker compose -f docker-compose.yml -f docker-compose.vulnerable.yml up

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file: .env.vulnerable
    environment:
      APP_MODE: vulnerable
      DATABASE_URL: postgresql+asyncpg://lab:labpass@postgres:5432/app_db
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./middleware:/app/middleware:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed_db.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    restart: unless-stopped
