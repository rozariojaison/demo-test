version: "3.9"

# Secured mode overlay — RS256 JWT, rate limiting, Kong gateway, Konga UI.
# Usage: docker compose -f docker-compose.yml -f docker-compose.secured.yml up
# Pre-requisite: python scripts/generate_keys.py  (creates secrets/private.pem + public.pem)

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file: .env.secured
    environment:
      APP_MODE: secured
      DATABASE_URL: postgresql+asyncpg://lab:labpass@postgres:5432/app_db
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed_db.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    restart: unless-stopped

  kong:
    build:
      context: .
      dockerfile: docker/Dockerfile.kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8080"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: info
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8080:8080"    # Public proxy — clients send requests here
      - "8001:8001"    # Kong Admin API
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  konga:
    image: pantsel/konga:latest
    environment:
      NODE_ENV: production
      TOKEN_SECRET: lab_konga_secret
    ports:
      - "1337:1337"    # Konga Admin UI — visit http://localhost:1337
    depends_on:
      - kong
    restart: unless-stopped
